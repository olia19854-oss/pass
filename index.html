<title>Пароли</title>
<style>
:root {
  --bg: #F3F2FB; --card: #FFFFFF; --field: #ECEAF8; --fg: #1B1A2E; --muted: #6A688A; --border: #D9D6EE;
  --accent: #5B5BE6; --accent-hover: #4A4AD2; --on-accent: #FFFFFF; --danger: #C62849; --ok: #0F8F63;
  --g1: #4338CA; --g2: #7C3AED; --g3: #DB2777; --scrim: rgba(20,18,45,.55);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121120; --card: #1C1B31; --field: #26243F; --fg: #EEEDFB; --muted: #9E9CC4; --border: #34325A;
  --accent: #7274F2; --accent-hover: #8A8CFF; --on-accent: #0F0E1E; --danger: #FF6B86; --ok: #46D8A2;
  --g1: #312E81; --g2: #6D3FD6; --g3: #C026D3; color-scheme: dark; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
.gut { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { background: linear-gradient(135deg, var(--g1), var(--g2) 55%, var(--g3)); color: #fff; padding-top: env(safe-area-inset-top, 0px); position: sticky; top: 0; z-index: 5; }
.hero .gut { display: flex; align-items: center; gap: 12px; min-height: 68px; padding-block: 10px; }
.logo { flex: none; width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6D70FF, #4338CA); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.hero h1 { margin: 0; font-size: 19px; line-height: 1.2; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.hbtn { flex: none; min-width: 44px; min-height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.14); color: #fff; cursor: pointer; font-weight: 600; padding: 0 12px; }
main { max-width: 600px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 18px; }
.muted { color: var(--muted); font-size: 14px; }
.lbl { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
input[type=password], input[type=text], input[type=search], textarea, select { width: 100%; min-height: 48px; padding: 10px 14px; background: var(--field); border: 1px solid var(--border); border-radius: 12px; font-size: 16px; }
textarea { resize: vertical; min-height: 96px; }
textarea.mono, .mono { font-family: var(--mono); }
input:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:active { background: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.solid-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { min-height: 40px; padding: 0 14px; font-weight: 500; }
.btn[disabled] { opacity: .55; }
.link { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--accent); text-align: left; cursor: pointer; text-decoration: underline; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.err { color: var(--danger); font-size: 14px; min-height: 1.2em; overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--g2); padding-left: 10px; }
.warn { font-size: 14px; background: var(--field); border-left: 4px solid var(--danger); padding: 10px 12px; border-radius: 8px; }
.list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.item { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 8px 12px; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; min-width: 0; }
.item:active { background: var(--field); }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
.item .t { min-width: 0; display: grid; }
.item .t b, .item .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t span { color: var(--muted); font-size: 14px; }
.pw { display: flex; gap: 8px; }
.pw > input { flex: 1; min-width: 0; }
.fab { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 30px; border: 0; background: linear-gradient(135deg, var(--g2), var(--g3)); color: #fff; font-size: 32px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.35); cursor: pointer; z-index: 6; }
.keybox { font-family: var(--mono); font-size: 19px; font-weight: 700; letter-spacing: .5px; background: var(--field); border-radius: 12px; padding: 14px; text-align: center; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; line-height: 1.7; }
.gen { background: var(--field); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.gen .out { font-family: var(--mono); font-size: 18px; font-weight: 700; overflow-wrap: anywhere; text-align: center; padding: 6px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: grid; align-items: end; justify-items: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.sheet { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; display: grid; gap: 12px; }
.sheet h3 { margin: 0; font-size: 18px; }
.bar { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--g2), var(--g3)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14px; z-index: 40; }
.sep { height: 1px; background: var(--border); margin: 2px 0; }
.setrow { display: grid; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="hero"><div class="gut">
  <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="10" rx="3" fill="#fff"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15.3" r="1.5" fill="#4338CA"/></svg></div>
  <h1 id="hTitle">Пароли</h1>
  <button class="hbtn" id="hBack" type="button" hidden aria-label="Назад">‹</button>
  <button class="hbtn" id="hSet" type="button" hidden aria-label="Настройки">⚙</button>
  <button class="hbtn" id="hLang" type="button" aria-label="Language">EN</button>
</div></header>

<main id="main">
  <!-- Приветствие: создать хранилище -->
  <section id="vWelcome" class="card" hidden>
    <h2 data-i="welcomeTitle"></h2>
    <p class="muted" data-i="welcomeText"></p>
    <div><label class="lbl" for="cPw" data-i="newMaster"></label><input id="cPw" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div><label class="lbl" for="cPw2" data-i="repeat"></label><input id="cPw2" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <label class="chk"><input type="checkbox" id="cShow"><span data-i="showPw"></span></label>
    <div class="err" id="cErr" role="alert"></div>
    <button class="btn primary" id="cBtn" type="button" data-i="createBtn"></button>
    <button class="link" id="wImport" type="button" data-i="restoreFile"></button>
    <p class="note" data-i="noteLocal"></p>
  </section>

  <!-- Вход -->
  <section id="vUnlock" class="card" hidden>
    <h2 data-i="unlockTitle"></h2>
    <div><label class="lbl" for="uPw" data-i="master"></label><input id="uPw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    <div class="err" id="uErr" role="alert"></div>
    <button class="btn primary" id="uBtn" type="button" data-i="open"></button>
    <button class="link" id="uForgot" type="button" data-i="forgot"></button>
    <button class="link" id="uImport" type="button" data-i="restoreFile"></button>
  </section>

  <!-- Забыли пароль -->
  <section id="vRecover" class="card" hidden>
    <h2 data-i="recoverTitle"></h2>
    <p class="muted" data-i="recoverText"></p>
    <div><label class="lbl" for="rKey" data-i="recKey"></label><textarea id="rKey" class="mono" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-…"></textarea></div>
    <div><label class="lbl" for="rPw" data-i="newMaster"></label><input id="rPw" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div><label class="lbl" for="rPw2" data-i="repeat"></label><input id="rPw2" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="err" id="rErr" role="alert"></div>
    <button class="btn primary" id="rBtn" type="button" data-i="recoverBtn"></button>
  </section>

  <!-- Показ ключа восстановления -->
  <section id="vKey" class="card" hidden>
    <h2 data-i="keyTitle"></h2>
    <p class="muted" data-i="keyText"></p>
    <div class="keybox" id="keyBox"></div>
    <div class="row"><button class="btn" id="kCopy" type="button" data-i="copy"></button><button class="btn" id="kShare" type="button" data-i="saveKey"></button></div>
    <label class="chk"><input type="checkbox" id="kOk"><span data-i="keyOk"></span></label>
    <button class="btn primary" id="kDone" type="button" disabled data-i="done"></button>
  </section>

  <!-- Список -->
  <section id="vList" hidden>
    <div class="card">
      <div class="warn" id="bkWarn" hidden><span id="bkWarnText"></span> <button class="link" id="bkNow" type="button" data-i="backupNow"></button></div>
      <input id="search" type="search" autocomplete="off" aria-label="Search">
      <div class="muted" id="count"></div>
      <ul class="list" id="list"></ul>
    </div>
  </section>
  <button class="fab" id="fab" type="button" hidden aria-label="+">+</button>

  <!-- Запись -->
  <section id="vEdit" class="card" hidden>
    <div><label class="lbl" for="eTitle" data-i="fTitle"></label><input id="eTitle" type="text" autocomplete="off" autocapitalize="sentences"></div>
    <div><label class="lbl" for="eLogin" data-i="login"></label><div class="pw"><input id="eLogin" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="btn small" id="cLogin" type="button" data-i="copy"></button></div></div>
    <div><label class="lbl" for="ePass" data-i="password"></label><div class="pw"><input id="ePass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="btn small" id="sPass" type="button"></button></div></div>
    <div class="row"><button class="btn small" id="cPass" type="button" data-i="copyPass"></button><button class="btn small" id="gToggle" type="button" data-i="generate"></button></div>
    <div class="gen" id="genBox" hidden>
      <div class="out" id="genOut"></div><div class="muted" id="genInfo" style="text-align:center"></div>
      <div><label class="lbl" for="gLen"><span data-i="length"></span>: <b id="gLenV">20</b></label><input type="range" id="gLen" min="8" max="40" value="20"></div>
      <label class="chk"><input type="checkbox" id="gLower" checked><span data-i="gLower"></span></label>
      <label class="chk"><input type="checkbox" id="gUpper" checked><span data-i="gUpper"></span></label>
      <label class="chk"><input type="checkbox" id="gDigits" checked><span data-i="gDigits"></span></label>
      <label class="chk"><input type="checkbox" id="gSym" checked><span data-i="gSym"></span></label>
      <label class="chk"><input type="checkbox" id="gClear" checked><span data-i="gClear"></span></label>
      <div class="row"><button class="btn small" id="gAgain" type="button" data-i="another"></button><button class="btn primary small" id="gUse" type="button" data-i="use"></button></div>
    </div>
    <div><label class="lbl" for="eUrl" data-i="link"></label><input id="eUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div><label class="lbl" for="eNote" data-i="note"></label><textarea id="eNote"></textarea></div>
    <div class="err" id="eErr" role="alert"></div>
    <div class="row"><button class="btn primary" id="eSave" type="button" data-i="save"></button><button class="btn" id="eCancel" type="button" data-i="cancel"></button></div>
    <button class="btn danger" id="eDel" type="button" data-i="deleteEntry" hidden></button>
  </section>

  <!-- Настройки -->
  <section id="vSettings" hidden>
    <div class="card">
      <div class="setrow"><b data-i="setSecurity"></b>
        <button class="btn" id="sChange" type="button" data-i="changePw"></button>
        <button class="btn" id="sRec" type="button"></button>
        <div><label class="lbl" for="sIdle" data-i="autolock"></label><select id="sIdle"></select></div>
      </div>
      <div class="sep"></div>
      <div class="setrow"><b data-i="setBackup"></b>
        <p class="muted" id="bkInfo"></p>
        <button class="btn primary" id="sExport" type="button" data-i="exportBtn"></button>
        <button class="btn" id="sMerge" type="button" data-i="mergeBtn"></button>
        <button class="btn" id="sReplace" type="button" data-i="replaceBtn"></button>
      </div>
      <div class="sep"></div>
      <div class="setrow"><b data-i="setOther"></b>
        <button class="btn" id="sLock" type="button" data-i="lock"></button>
        <button class="btn danger" id="sWipe" type="button" data-i="wipe"></button>
        <p class="note" data-i="noteStore"></p>
        <p class="muted" id="ver"></p>
      </div>
    </div>
  </section>
</main>

<div class="scrim" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<input id="fileIn" type="file" hidden>

<script>
"use strict";

(function(root) {
    const MAX_VALUE = 0x7fffffff;

    // The SHA256 and PBKDF2 implementation are from scrypt-async-js:
    // See: https://github.com/dchest/scrypt-async-js
    function SHA256(m) {
        const K = new Uint32Array([
           0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b,
           0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01,
           0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7,
           0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
           0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152,
           0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
           0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc,
           0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
           0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819,
           0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08,
           0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f,
           0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
           0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
       ]);

        let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
        let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
        const w = new Uint32Array(64);

        function blocks(p) {
            let off = 0, len = p.length;
            while (len >= 64) {
                let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7, u, i, j, t1, t2;

                for (i = 0; i < 16; i++) {
                    j = off + i*4;
                    w[i] = ((p[j] & 0xff)<<24) | ((p[j+1] & 0xff)<<16) |
                    ((p[j+2] & 0xff)<<8) | (p[j+3] & 0xff);
                }

                for (i = 16; i < 64; i++) {
                    u = w[i-2];
                    t1 = ((u>>>17) | (u<<(32-17))) ^ ((u>>>19) | (u<<(32-19))) ^ (u>>>10);

                    u = w[i-15];
                    t2 = ((u>>>7) | (u<<(32-7))) ^ ((u>>>18) | (u<<(32-18))) ^ (u>>>3);

                    w[i] = (((t1 + w[i-7]) | 0) + ((t2 + w[i-16]) | 0)) | 0;
                }

                for (i = 0; i < 64; i++) {
                    t1 = ((((((e>>>6) | (e<<(32-6))) ^ ((e>>>11) | (e<<(32-11))) ^
                             ((e>>>25) | (e<<(32-25)))) + ((e & f) ^ (~e & g))) | 0) +
                          ((h + ((K[i] + w[i]) | 0)) | 0)) | 0;

                    t2 = ((((a>>>2) | (a<<(32-2))) ^ ((a>>>13) | (a<<(32-13))) ^
                           ((a>>>22) | (a<<(32-22)))) + ((a & b) ^ (a & c) ^ (b & c))) | 0;

                    h = g;
                    g = f;
                    f = e;
                    e = (d + t1) | 0;
                    d = c;
                    c = b;
                    b = a;
                    a = (t1 + t2) | 0;
                }

                h0 = (h0 + a) | 0;
                h1 = (h1 + b) | 0;
                h2 = (h2 + c) | 0;
                h3 = (h3 + d) | 0;
                h4 = (h4 + e) | 0;
                h5 = (h5 + f) | 0;
                h6 = (h6 + g) | 0;
                h7 = (h7 + h) | 0;

                off += 64;
                len -= 64;
            }
        }

        blocks(m);

        let i, bytesLeft = m.length % 64,
        bitLenHi = (m.length / 0x20000000) | 0,
        bitLenLo = m.length << 3,
        numZeros = (bytesLeft < 56) ? 56 : 120,
        p = m.slice(m.length - bytesLeft, m.length);

        p.push(0x80);
        for (i = bytesLeft + 1; i < numZeros; i++) { p.push(0); }
        p.push((bitLenHi >>> 24) & 0xff);
        p.push((bitLenHi >>> 16) & 0xff);
        p.push((bitLenHi >>> 8)  & 0xff);
        p.push((bitLenHi >>> 0)  & 0xff);
        p.push((bitLenLo >>> 24) & 0xff);
        p.push((bitLenLo >>> 16) & 0xff);
        p.push((bitLenLo >>> 8)  & 0xff);
        p.push((bitLenLo >>> 0)  & 0xff);

        blocks(p);

        return [
            (h0 >>> 24) & 0xff, (h0 >>> 16) & 0xff, (h0 >>> 8) & 0xff, (h0 >>> 0) & 0xff,
            (h1 >>> 24) & 0xff, (h1 >>> 16) & 0xff, (h1 >>> 8) & 0xff, (h1 >>> 0) & 0xff,
            (h2 >>> 24) & 0xff, (h2 >>> 16) & 0xff, (h2 >>> 8) & 0xff, (h2 >>> 0) & 0xff,
            (h3 >>> 24) & 0xff, (h3 >>> 16) & 0xff, (h3 >>> 8) & 0xff, (h3 >>> 0) & 0xff,
            (h4 >>> 24) & 0xff, (h4 >>> 16) & 0xff, (h4 >>> 8) & 0xff, (h4 >>> 0) & 0xff,
            (h5 >>> 24) & 0xff, (h5 >>> 16) & 0xff, (h5 >>> 8) & 0xff, (h5 >>> 0) & 0xff,
            (h6 >>> 24) & 0xff, (h6 >>> 16) & 0xff, (h6 >>> 8) & 0xff, (h6 >>> 0) & 0xff,
            (h7 >>> 24) & 0xff, (h7 >>> 16) & 0xff, (h7 >>> 8) & 0xff, (h7 >>> 0) & 0xff

  }

  /* ---------- вход ---------- */
  async function doUnlock() {
    if (working || !rec) return;
    var pw = $("uPw").value, err = $("uErr"); err.textContent = "";
    if (!pw) { err.textContent = t("needPw"); return; }
    var b = busy(t("busyKey"));
    try {
      var st = await core.openWithPassword(ctx, rec.bytes, pw, b.progress);
      state = st; if (st.upgraded) await persist();
      $("uPw").value = ""; b.close(); enter();
    } catch (e) { b.close(); err.textContent = errText(e); }
  }
  function enter() { $("search").value = ""; renderList(); show("vList"); backupWarn(); armIdle(); }

  async function doRecover() {
    if (working || !rec) return;
    var key = $("rKey").value, pw = $("rPw").value, err = $("rErr"); err.textContent = "";
    if (!key.trim()) { err.textContent = t("needKey"); return; }
    if (Array.from(pw).length < core.MIN_PASSWORD_LEN) { err.textContent = t("shortPw"); return; }
    if (pw !== $("rPw2").value) { err.textContent = t("mismatch"); return; }
    var b = busy(t("busyKey2"));
    try {
      var st = await core.openWithRecovery(ctx, rec.bytes, key);
      await core.changePassword(ctx, st, pw, b.progress);
      state = st; await persist();
      $("rKey").value = $("rPw").value = $("rPw2").value = ""; b.close(); toast(t("recovered")); enter();
    } catch (e) { b.close(); err.textContent = errText(e); }
  }

  /* ---------- список ---------- */
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
  function avatar(n, title) { n.textContent = (title.trim()[0] || "?").toUpperCase(); n.style.background = "hsl(" + hue(title) + " 62% 42%)"; }
  function renderList() {
    var q = $("search").value.trim().toLowerCase(), ul = $("list"); ul.textContent = "";
    if (!state) return;
    var all = state.entries.slice().sort(function (a, b) { return (a.title || "").localeCompare(b.title || "", lang); });
    var shown = all.filter(function (e) { return !q || [e.title, e.login, e.url].some(function (v) { return (v || "").toLowerCase().indexOf(q) >= 0; }); });
    $("count").textContent = !all.length ? t("emptyList") : shown.length ? t("count", { n: shown.length }) : t("nothing");
    shown.forEach(function (e) {
      var li = el("li"), b = el("button", "item"), av = el("div", "av"), box = el("div", "t");
      b.type = "button"; avatar(av, e.title || "?"); box.appendChild(el("b", "", e.title || "")); box.appendChild(el("span", "", e.login || ""));
      b.appendChild(av); b.appendChild(box); li.appendChild(b); ul.appendChild(li);
      b.addEventListener("click", function () { openEdit(e.id); });
    });
  }
  function backupWarn() {
    var w = $("bkWarn"), last = parseInt(ls("pm_backup"), 10) || 0, days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    if (!state || !state.entries.length) { w.hidden = true; return; }
    if (!last) { $("bkWarnText").textContent = t("bkNever"); w.hidden = false; }
    else if (days >= BACKUP_DAYS) { $("bkWarnText").textContent = t("bkOld", { d: days }); w.hidden = false; }
    else w.hidden = true;
  }

  /* ---------- запись ---------- */
  function formValues() { return JSON.stringify([$("eTitle").value, $("eLogin").value, $("ePass").value, $("eUrl").value, $("eNote").value]); }
  function openEdit(id) {
    editId = id || null; var e = id ? state.entries.filter(function (x) { return x.id === id; })[0] : null;
    $("eTitle").value = e ? e.title || "" : ""; $("eLogin").value = e ? e.login || "" : ""; $("ePass").value = e ? e.password || "" : "";
    $("eUrl").value = e ? e.url || "" : ""; $("eNote").value = e ? e.note || "" : "";
    $("ePass").type = "password"; $("sPass").textContent = t("show"); $("genBox").hidden = true; $("eErr").textContent = "";
    $("eDel").hidden = !e; baseline = formValues(); show("vEdit"); if (!e) setTimeout(function () { if (view === "vEdit" && (!document.activeElement || document.activeElement === document.body)) $("eTitle").focus(); }, 60);
  }
  async function leaveEdit() {
    if (formValues() !== baseline) {
      var v = await ask(t("discardTitle"), t("discardText"), [{ label: t("keepEditing"), value: false }, { label: t("discard"), value: true, cls: "danger" }]);
      if (!v) return;
    }
    $("ePass").value = ""; show("vList"); renderList();
  }
  async function saveEdit() {
    var title = $("eTitle").value.trim(); $("eErr").textContent = "";
    if (!title) { $("eErr").textContent = t("needTitle"); return; }
    var vals = { title: title, login: $("eLogin").value, password: $("ePass").value, url: $("eUrl").value.trim(), note: $("eNote").value };
    var snapshot = JSON.stringify(state.entries);
    if (editId) { state.entries.forEach(function (x) { if (x.id === editId) Object.assign(x, vals); }); }
    else { vals.id = core.newId(); state.entries.push(vals); }
    try { await persist(); } catch (e) { state.entries = JSON.parse(snapshot); $("eErr").textContent = errText(e); return; }
    $("ePass").value = ""; toast(t("saved")); show("vList"); renderList(); backupWarn();
  }
  async function deleteEdit() {
    var e = state.entries.filter(function (x) { return x.id === editId; })[0]; if (!e) return;
    var v = await ask(t("delTitle"), t("delText", { t: e.title }), [{ label: t("cancel"), value: false }, { label: t("del"), value: true, cls: "solid-danger" }]);
    if (!v) return;
    var snapshot = JSON.stringify(state.entries);
    state.entries = state.entries.filter(function (x) { return x.id !== editId; });
    try { await persist(); } catch (er) { state.entries = JSON.parse(snapshot); $("eErr").textContent = errText(er); return; }
    toast(t("deleted")); show("vList"); renderList(); backupWarn();
  }

  /* ---------- генератор ---------- */
  var LOW = "abcdefghijklmnopqrstuvwxyz", UP = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", DIG = "0123456789", SYM = "!@#$%^&*-_=+?", AMB = "Il1O0o";
  function randInt(n) { var lim = Math.floor(4294967296 / n) * n, a = new Uint32Array(1); do { crypto.getRandomValues(a); } while (a[0] >= lim); return a[0] % n; }
  function genPassword(len, sets, clear) {
    var pools = sets.map(function (s) { return clear ? s.split("").filter(function (c) { return AMB.indexOf(c) < 0; }).join("") : s; });
    if (!pools.length) return "";
    var chars = pools.map(function (p) { return p[randInt(p.length)]; }), all = pools.join("");
    while (chars.length < len) chars.push(all[randInt(all.length)]);
    for (var i = chars.length - 1; i > 0; i--) { var j = randInt(i + 1), x = chars[i]; chars[i] = chars[j]; chars[j] = x; }
    return chars.join("");
  }
  var genValue = "";
  function regen() {
    var sets = []; if ($("gLower").checked) sets.push(LOW); if ($("gUpper").checked) sets.push(UP); if ($("gDigits").checked) sets.push(DIG); if ($("gSym").checked) sets.push(SYM);
    var len = parseInt($("gLen").value, 10); $("gLenV").textContent = len;
    genValue = genPassword(len, sets, $("gClear").checked);
    $("genOut").textContent = genValue || "—";
    var pool = sets.join("").length, bits = genValue ? Math.floor(len * Math.log2(Math.max(pool, 2))) : 0;
    $("genInfo").textContent = genValue ? t("strength", { level: t(bits >= 100 ? "s_great" : bits >= 70 ? "s_good" : "s_weak"), bits: bits }) : "";
  }

  /* ---------- буфер обмена ---------- */
  function copy(text) {
    if (!text) return;
    var done = function () { toast(t("copied")); clipText = text; clearTimeout(clipTimer); clipTimer = setTimeout(wipeClip, CLIP_MS); };
    var fallback = function () {
      try { var ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand("copy"); document.body.removeChild(ta); ok ? done() : toast(t("copyFail")); } catch (e) { toast(t("copyFail")); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  function wipeClip() { clipText = null; clearTimeout(clipTimer); try { navigator.clipboard.writeText(" ").catch(function () {}); } catch (e) {} }

  /* ---------- настройки и копии ---------- */
  function renderSettings() {
    $("sRec").textContent = state && state.recSlot ? t("newKey") : t("createKey");
    var last = parseInt(ls("pm_backup"), 10) || 0;
    $("bkInfo").textContent = last ? t("bkOk", { date: new Date(last).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" }) }) : t("bkNone");
  }
  async function doExport() {
    if (!state) return;
    var blob = await core.serialize(ctx, state), d = new Date(), p = function (n) { return ("0" + n).slice(-2); };
    var name = "passwords-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".vault";
    var file = new File([blob], name, { type: "application/octet-stream" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); ls("pm_backup", String(Date.now())); toast(t("exported")); backupWarn(); renderSettings(); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    var url = URL.createObjectURL(new Blob([blob], { type: "application/octet-stream" })), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 15000);
    ls("pm_backup", String(Date.now())); toast(t("exported")); backupWarn(); renderSettings();
  }
  function pickFile() {
    return new Promise(function (res) {
      var inp = $("fileIn"); inp.value = "";
      inp.onchange = function () {
        var f = inp.files && inp.files[0]; if (!f) { res(null); return; }
        var r = new FileReader(); r.onerror = function () { res({ error: "read" }); };
        r.onload = function () { res({ bytes: new Uint8Array(r.result), name: f.name }); }; r.readAsArrayBuffer(f);
      };
      inp.click();
    });
  }
  async function restoreFile() {
    var f = await pickFile(); if (!f) return;
    if (f.error) { toast(t("e_read")); return; }
    try { core.parse(f.bytes); } catch (e) { toast(errText(e)); return; }
    if (rec || state) {
      var ok = await ask(t("replaceTitle"), t("replaceText"), [{ label: t("cancel"), value: false }, { label: t("replace"), value: true, cls: "danger" }]);
      if (!ok) return;
    }
    try { if (rec) await dbPut("prev", rec); rec = { bytes: f.bytes, updated: Date.now() }; await dbPut("vault", rec); } catch (e) { toast(errText({ code: "store" })); return; }
    if (state) { core.wipe(state); state = null; }
    $("uErr").textContent = ""; show("vUnlock"); toast(t("restored")); setTimeout(function () { $("uPw").focus(); }, 80);
  }
  async function mergeFile() {
    var f = await pickFile(); if (!f) return;
    if (f.error) { toast(t("e_read")); return; }
    try { core.parse(f.bytes); } catch (e) { toast(errText(e)); return; }
    var pw = await askOne(t("filePwTitle"), t("filePwText")); if (!pw) return;
    var b = busy(t("busyKey2")), other;
    try { other = await core.openWithPassword(ctx, f.bytes, pw, b.progress); } catch (e) { b.close(); toast(errText(e)); return; }
    b.close();
    var seen = {}; state.entries.forEach(function (x) { seen[(x.title || "").toLowerCase() + "|" + (x.login || "").toLowerCase()] = 1; });
    var added = 0, skipped = 0, snapshot = JSON.stringify(state.entries);
    other.entries.forEach(function (x) {
      var k = (x.title || "").toLowerCase() + "|" + (x.login || "").toLowerCase();
      if (!x.title || seen[k]) { skipped++; return; }
      seen[k] = 1; added++;
      state.entries.push({ id: core.newId(), title: x.title, login: x.login || "", password: x.password || "", url: x.url || "", note: x.note || "" });
    });
    core.wipe(other);
    try { await persist(); } catch (e) { state.entries = JSON.parse(snapshot); toast(errText(e)); return; }
    toast(t("merged", { n: added, k: skipped }));
  }

  /* ---------- блокировка ---------- */
  function lock(reasonKey, vars) {
    if (state) { core.wipe(state); state = null; }
    clearTimeout(idleTimer); if (clipText) wipeClip();
    $("list").textContent = ""; $("ePass").value = ""; $("eTitle").value = ""; $("eLogin").value = ""; $("eUrl").value = ""; $("eNote").value = ""; $("search").value = "";
    $("modal").hidden = true; $("sheet").textContent = ""; working = false; keyNext = null;
    if (rec) { show("vUnlock"); $("uErr").textContent = reasonKey ? t("locked", { s: t(reasonKey, vars) }) : ""; } else show("vWelcome");
  }
  function armIdle() {
    clearTimeout(idleTimer);
    if (state && !working) idleTimer = setTimeout(function () { lock("rIdle", { n: idleMin() }); }, idleMin() * 60000);
  }

  /* ---------- события ---------- */
  function on(id, ev, fn) { $(id).addEventListener(ev, fn); }
  on("cBtn", "click", doCreate);
  on("cShow", "change", function () { var ty = $("cShow").checked ? "text" : "password"; $("cPw").type = ty; $("cPw2").type = ty; });
  on("wImport", "click", restoreFile); on("uImport", "click", restoreFile);
  on("uBtn", "click", doUnlock);
  on("uPw", "keydown", function (e) { if (e.key === "Enter") doUnlock(); });
  on("uForgot", "click", function () { $("rErr").textContent = ""; show("vRecover"); });
  on("rBtn", "click", doRecover);
  on("hBack", "click", function () {
    if (view === "vEdit") leaveEdit(); else if (view === "vSettings") { show("vList"); renderList(); } else if (view === "vRecover") show("vUnlock");
  });
  on("hSet", "click", function () { renderSettings(); show("vSettings"); });
  on("hLang", "click", function () { lang = lang === "ru" ? "en" : "ru"; ls("pm_lang", lang); applyLang(); });
  on("kOk", "change", function () { $("kDone").disabled = !$("kOk").checked; });
  on("kCopy", "click", function () { copy($("keyBox").dataset.key); });
  on("kShare", "click", function () { shareText("recovery-key.txt", "Recovery key / Ключ восстановления\n\n" + $("keyBox").dataset.key + "\n\nKeep it apart from the phone. Anyone with this key can open the vault.\n", "text/plain"); });
  on("kDone", "click", function () {
    if (!$("kOk").checked) return; var next = keyNext; keyNext = null; $("keyBox").textContent = ""; $("keyBox").dataset.key = "";
    if (next === "settings") { renderSettings(); show("vSettings"); } else enter();
  });
  on("search", "input", renderList);
  on("fab", "click", function () { openEdit(null); });
  on("bkNow", "click", doExport);
  on("sPass", "click", function () { var hid = $("ePass").type === "password"; $("ePass").type = hid ? "text" : "password"; $("sPass").textContent = hid ? t("hide") : t("show"); });
  on("cPass", "click", function () { copy($("ePass").value); });
  on("cLogin", "click", function () { copy($("eLogin").value); });
  on("eSave", "click", saveEdit); on("eCancel", "click", leaveEdit); on("eDel", "click", deleteEdit);
  on("eTitle", "input", function () { if (editId) $("hTitle").textContent = $("eTitle").value || t("appName"); });
  on("gToggle", "click", function () { $("genBox").hidden = !$("genBox").hidden; if (!$("genBox").hidden) regen(); });
  ["gLen", "gLower", "gUpper", "gDigits", "gSym", "gClear"].forEach(function (id) { on(id, "input", regen); on(id, "change", regen); });
  on("gAgain", "click", regen);
  on("gUse", "click", function () { if (!genValue) return; $("ePass").value = genValue; $("ePass").type = "text"; $("sPass").textContent = t("hide"); $("genBox").hidden = true; });
  on("sIdle", "change", function () { ls("pm_idle", $("sIdle").value); armIdle(); });
  on("sLock", "click", function () { lock(); });
  on("sExport", "click", doExport); on("sMerge", "click", mergeFile); on("sReplace", "click", restoreFile);
  on("sChange", "click", async function () {
    var pw = await askPasswords(t("changeTitle"), t("changeText")); if (!pw) return;
    var b = busy(t("busyKey2"));
    try { await core.changePassword(ctx, state, pw, b.progress); await persist(); b.close(); toast(t("pwChanged")); } catch (e) { b.close(); toast(errText(e)); }
  });
  on("sRec", "click", async function () {
    var has = !!state.recSlot;
    var ok = await ask(has ? t("newKeyTitle") : t("createKeyTitle"), has ? t("newKeyText") : t("createKeyText"), [{ label: t("cancel"), value: false }, { label: t("create"), value: true, cls: "primary" }]);
    if (!ok) return;
    try { var key = await core.enableRecovery(ctx, state); await persist(); showKey(key, "settings"); } catch (e) { toast(errText(e)); }
  });
  on("sWipe", "click", async function () {
    var a = await ask(t("wipeTitle"), t("wipeText"), [{ label: t("cancel"), value: false }, { label: t("wipeYes"), value: true, cls: "danger" }]); if (!a) return;
    var b2 = await ask(t("wipe2Title"), t("wipe2Text"), [{ label: t("cancel"), value: false }, { label: t("wipeYes"), value: true, cls: "solid-danger" }]); if (!b2) return;
    try { await dbDel("vault"); await dbDel("prev"); } catch (e) {}
    rec = null; ls("pm_backup", null); if (state) { core.wipe(state); state = null; }
    show("vWelcome"); toast(t("wiped"));
  });
  ["pointerdown", "keydown", "scroll", "touchstart"].forEach(function (n) { document.addEventListener(n, armIdle, { passive: true, capture: true }); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) hiddenAt = Date.now();
    else if (state && hiddenAt && Date.now() - hiddenAt > AWAY_MS) lock("rAway");
    else armIdle();
  });
  window.__pm = { lock: lock, state: function () { return { open: !!state, view: view, n: state ? state.entries.length : 0 }; }, expire: function () { hiddenAt = Date.now() - 60000; } };

  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
  applyLang();
  dbGet("vault").then(function (r) { rec = r || null; show(rec ? "vUnlock" : "vWelcome"); if (rec) setTimeout(function () { try { if (document.activeElement === document.body) $("uPw").focus(); } catch (e) {} }, 100); },
                     function () { rec = null; show("vWelcome"); });
})();

</script>
</body>
</html>
